stages:
  - pr_agent

pr_agent_job:
  stage: pr_agent
  tags:
    - docker
  image:
    name: pragent/pr-agent:latest
    entrypoint: [""]
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    CONFIG__MODEL: "openai/cgm-eu"
    CONFIG__CUSTOM_MODEL_MAX_TOKENS: "128000"
    CONFIG__FALLBACK_MODELS: '["openai/cgm-eu"]'
    LITELLM__DROP_PARAMS: "True"
    PR_REVIEWER__EXTRA_INSTRUCTIONS: "This is a SvelteKit + TypeScript project using Drizzle ORM with SQLite. Prefer idiomatic Svelte 5 runes syntax. The Python subdir uses Ruff. Review for security: never expose API keys or .env contents."
  script:
    - cd /app
    - export MR_URL="$CI_MERGE_REQUEST_PROJECT_URL/merge_requests/$CI_MERGE_REQUEST_IID"
    - echo "MR_URL=$MR_URL"
    - export gitlab__url=$CI_SERVER_PROTOCOL://$CI_SERVER_FQDN
    - export gitlab__PERSONAL_ACCESS_TOKEN=$GITLAB_PERSONAL_ACCESS_TOKEN
    - export openai__key=$OPENAI_KEY
    - export openai__api_base=$OPENAI_API_BASE
    - export OPENAI_API_KEY=$OPENAI_KEY
    - python -m pr_agent.cli --pr_url="$MR_URL" describe
    - python -m pr_agent.cli --pr_url="$MR_URL" review
    - python -m pr_agent.cli --pr_url="$MR_URL" improve
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
